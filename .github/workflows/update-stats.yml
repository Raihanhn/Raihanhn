name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create assets folder
        run: mkdir -p assets

      - name: Fetch Top Langs card
        run: curl -sf "https://github-stats-extended-frontend-fawn.vercel.app/api/top-langs/?username=Raihanhn&theme=dracula&hide_border=true&bg_color=0D1117&title_color=4ADE80&text_color=FFFFFF&icon_color=21AFF0&langs_count=8" -o assets/top-langs.svg

      - name: Fetch Stats card
        run: curl -sf "https://github-stats-extended-frontend-fawn.vercel.app/api?username=Raihanhn&show_icons=true&theme=dracula&hide_border=true&bg_color=0D1117&title_color=4ADE80&icon_color=21AFF0&text_color=FFFFFF" -o assets/stats.svg

      - name: Fetch Streak card
        run: curl -sf "https://streak-stats.demolab.com/?user=Raihanhn&theme=dark&hide_border=true&background=0D1117&ring=4ADE80&fire=21AFF0&currStreakLabel=4ADE80" -o assets/streak.svg

      - name: Generate Trophy card
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: Raihanhn
          output_path: assets/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --staged --quiet || git commit -m "chore: update stats cards [skip ci]"
          git push
