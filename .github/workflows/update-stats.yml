name: Update GitHub Stats
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create assets folder
        run: mkdir -p assets

      - name: Fetch Stats card
        run: curl -sf "https://github-readme-stats-yourname.vercel.app/api?username=Raihanhn&show_icons=true&theme=dracula&hide_border=true" -o assets/stats.svg

      - name: Fetch Top Langs card
        run: curl -sf "https://github-readme-stats-yourname.vercel.app/api/top-langs/?username=Raihanhn&theme=dracula&hide_border=true&layout=compact" -o assets/top-langs.svg

      - name: Generate Streak card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          user: Raihanhn
          theme: dark
          hide_border: true
        env:
          path: assets/streak.svg

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --staged --quiet || git commit -m "chore: update stats cards [skip ci]"
          git push
